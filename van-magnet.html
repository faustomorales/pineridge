<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Van Magnet — Greenhouse Church</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/brand.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <style>
      :root {
        --sheet-width: 18in;
        --sheet-height: 12in;
        --preview-scale: 0.4;
      }

      body .sheet {
        background: var(--color-paper);
        border: 0.35in solid var(--color-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0.5in;
        padding: 0.4in;
      }

      .sheet img {
        width: 4in;
        height: 4in;
      }

      .sheet h1 {
        font-size: 110pt;
        color: var(--color-primary-dark);
        letter-spacing: 0.01em;
        line-height: 1;
      }

      .programs {
        font-size: 62pt;
        color: var(--color-ink);
        font-weight: 700;
      }

      .sheet .footer {
        font-size: 34pt;
        color: var(--color-muted);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="no-print">
        <button class="btn" data-print>Print / Save as PDF</button>
      </div>
      <div class="sheet-wrap">
        <div class="sheet">
          <img src="/src/assets/logo.svg" alt="" />
          <h1>Pineridge Programs</h1>
          <div class="programs">Tutoring • Kids Church • Youth</div>
          <div class="footer">Sponsored by Greenhouse Church • greenhousechurch.org</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/print.js"></script>
  </body>
</html>
